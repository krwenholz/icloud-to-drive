<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Markdown notes in iCloud Drive flowing one way into Google Docs in Google Drive">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#2f8cff"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35c"/>
      <stop offset="1" stop-color="#f5b400"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- iCloud -->
  <g transform="translate(40 30)">
    <path d="M52 118 H178 a38 38 0 0 0 4 -76 a52 52 0 0 0 -98 -14 a40 40 0 0 0 -52 40 a26 26 0 0 0 0 50 z"
          fill="url(#sky)"/>
    <!-- a Markdown note -->
    <g transform="translate(78 42)">
      <rect width="58" height="70" rx="7" fill="#fff"/>
      <text x="29" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="22" font-weight="700" fill="#2f8cff">.md</text>
    </g>
    <text x="115" y="150" text-anchor="middle" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="15" fill="#8a94a6">iCloud Drive</text>
  </g>

  <!-- one-way arrow with notes in flight -->
  <path d="M262 102 H448" stroke="#8a94a6" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"
        fill="none" marker-end="url(#head)"/>
  <g fill="#fff" stroke="#c3cad6" stroke-width="2">
    <rect x="300" y="70" width="22" height="27" rx="3" transform="rotate(-8 311 83)"/>
    <rect x="352" y="62" width="22" height="27" rx="3" transform="rotate(6 363 75)"/>
    <rect x="402" y="72" width="22" height="27" rx="3" transform="rotate(-4 413 85)"/>
  </g>
  <text x="355" y="138" text-anchor="middle" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
        font-size="13" fill="#8a94a6">one way, every few seconds</text>

  <!-- Drive folder with a Doc -->
  <g transform="translate(478 42)">
    <path d="M0 22 a10 10 0 0 1 10 -10 H70 l14 14 H190 a10 10 0 0 1 10 10 V108 a10 10 0 0 1 -10 10 H10 a10 10 0 0 1 -10 -10 z"
          fill="url(#folder)"/>
    <g transform="translate(70 30)">
      <path d="M0 6 a6 6 0 0 1 6 -6 H40 L60 20 V74 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 z" fill="#4285f4"/>
      <path d="M40 0 V14 a6 6 0 0 0 6 6 H60 z" fill="#a1c2fa"/>
      <rect x="12" y="34" width="36" height="5" rx="2.5" fill="#fff"/>
      <rect x="12" y="46" width="36" height="5" rx="2.5" fill="#fff"/>
      <rect x="12" y="58" width="24" height="5" rx="2.5" fill="#fff"/>
    </g>
    <text x="100" y="138" text-anchor="middle" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="15" fill="#8a94a6">Google Drive</text>
  </g>
</svg>
